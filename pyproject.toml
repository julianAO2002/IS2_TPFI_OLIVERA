[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tpfi"
version = "1.0.0"
description = "TPFI de Ingenieria de Software II: patrones Singleton, Proxy y Observer sobre AWS DynamoDB."
readme = "README.md"
authors = [
  {name = "Julian Olivera", email = "julianolivera200277@gmail.com"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = ["boto3"]
requires-python = ">= 3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/tpfi"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["odd", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP8)
    "W",   # pycodestyle warnings (PEP8)
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "D",   # pydocstyle (PEP257)
    "S",   # flake8-bandit
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# En las pruebas el uso de assert y de procesos auxiliares es lo esperado.
# El nombre de cada prueba ya describe la regla que verifica.
# Los scripts solo ejecutan herramientas del proyecto, con argumentos fijos.
"scripts/*" = ["S603"]
"tests/*" = ["S101", "S603", "S105", "S106", "D102", "D103"]

[tool.black]
line-length = 120
target-version = ["py312"]
extend-exclude = "(odd|docs)/"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.bandit]
exclude_dirs = [".venv", "tests", "odd", "docs"]

[tool.coverage.run]
branch = true
source = ["src/tpfi"]

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "acceptance: prueba de aceptacion que levanta los programas reales como procesos.",
    "aws: prueba que escribe en las tablas reales de AWS (requiere TPFI_ACCEPTANCE_AWS=1).",
]
