# Entrega continua: al integrar un PR en main repite todo el CI y, si pasa,
# construye el paquete y publica la documentacion en GitHub Pages.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: entrega
  # Una publicacion en curso termina antes de iniciar la siguiente.
  cancel-in-progress: false

jobs:
  ci:
    name: Compuerta de CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  paquete:
    name: Construir paquete
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Construir wheel y sdist
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tpfi-paquete
          path: dist/

  documentacion:
    name: Construir documentacion
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Generar documentacion
        run: |
          python -m pip install -r requirements.txt
          python scripts/build_docs.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/api

  publicar:
    name: Publicar en GitHub Pages
    needs: [paquete, documentacion]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
