# Integración continua: se ejecuta en cada PR y es reutilizada por el workflow de entrega.
# Ningún job necesita credenciales de AWS: las pruebas usan moto, un DynamoDB simulado.
name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad estática
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ambiente virtual y dependencias
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: ruff (reglas de formato)
        run: .venv/bin/ruff check .
      - name: black (formato consistente)
        run: .venv/bin/black --check .
      - name: pycodestyle (PEP8)
        run: .venv/bin/pycodestyle --max-line-length=120 --ignore=E203,W503 src tests scripts *.py
      - name: pydocstyle (PEP257)
        run: .venv/bin/pydocstyle --convention=pep257 src scripts *.py
      - name: mypy
        run: .venv/bin/mypy
      - name: pyright
        run: .venv/bin/pyright
      - name: bandit (seguridad)
        run: .venv/bin/bandit -q -c pyproject.toml -r src scripts *.py

  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # El bloqueo del puerto se comporta distinto en Windows y Linux: se prueban ambos.
        os: [ubuntu-latest, windows-latest]
    env:
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: pytest con cobertura mínima de 85%
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85

  secretos:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Buscar secretos en el historial
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --results=verified,unknown

  documentacion:
    name: Documentación (pdoc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Generar documentación
        run: python scripts/build_docs.py
